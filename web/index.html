<title>Smart Plant OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..600&family=Onest:wght@300..700&display=swap">
<style>
/* Концепт: подоконник. Растение живёт в арке-окне, горшок показывает влажность. Остальное тихое: воздух, линии, текст. */
:root{
  --bg:#F0F2EC;--surface:#FAFBF8;--elev:#FFFFFF;--border:#D9DED4;
  --tx:#17201B;--tx2:#4F5F56;--mu:#5C6C63;
  --pri:#2C6A4F;--onpri:#FFFFFF;--water:#23788E;--sun:#8F5C08;
  --ok:#2F7D4B;--warn:#8F5C08;--danger:#B3392F;
  --sky:#E3EBE6;--soil:#BBA183;--shadow:0 12px 32px rgba(23,32,27,.14);--shine:rgba(255,255,255,.3);--leaf-hi:#5DAA80;--leaf-lo:#28694D;--fruit:#D4432E;--fruit-hi:#F58C76;--fruit-lo:#962818;--bloom:#DD789E;--bloom-hi:#F9C8DA;--pot:#C48A68;--dirt:#6D5039;
  --display:'Literata',Georgia,serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r1:6px;--r2:10px;--r3:16px;--r4:28px;
} 
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613;--surface:#181F1B;--elev:#202A25;--border:#2E3A34;
  --tx:#E9EFEA;--tx2:#B5C2BA;--mu:#8D9D94;
  --pri:#86CFA8;--onpri:#0E2A1C;--water:#74C4DA;--sun:#EDB655;
  --ok:#7ACB92;--warn:#EDB655;--danger:#FF8A80;
  --sky:#1E2A25;--soil:#5B4A3A;--shadow:none;--shine:rgba(255,255,255,.07);--leaf-hi:#6EBB92;--leaf-lo:#357B5A;--fruit:#E5604D;--fruit-hi:#F9A090;--fruit-lo:#A5342A;--bloom:#EE8FB0;--bloom-hi:#FAD2E0;--pot:#B07A5A;--dirt:#4A382A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--surface:#181F1B;--elev:#202A25;--border:#2E3A34;
  --tx:#E9EFEA;--tx2:#B5C2BA;--mu:#8D9D94;
  --pri:#86CFA8;--onpri:#0E2A1C;--water:#74C4DA;--sun:#EDB655;
  --ok:#7ACB92;--warn:#EDB655;--danger:#FF8A80;
  --sky:#1E2A25;--soil:#5B4A3A;--shadow:none;--shine:rgba(255,255,255,.07);--leaf-hi:#6EBB92;--leaf-lo:#357B5A;--fruit:#E5604D;--fruit-hi:#F9A090;--fruit-lo:#A5342A;--bloom:#EE8FB0;--bloom-hi:#FAD2E0;--pot:#B07A5A;--dirt:#4A382A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.mu{color:var(--mu)}.t2{color:var(--tx2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:13px;font-weight:500;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}

/* оболочка */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.main{width:100%;max-width:1120px;margin:0 auto;padding:0 20px calc(170px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:16px 0 10px}
.brand{font:500 17px var(--display);display:flex;align-items:center;gap:10px}
.brand i{width:18px;height:22px;border:2px solid var(--pri);border-radius:99px 99px 3px 3px;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:50%;bottom:3px;width:2px;height:9px;background:var(--pri);transform:translateX(-50%)}
.modebar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--onpri)}
.seg.full{display:flex}.seg.full button{flex:1}
.modebar .seg{flex:1}
.iconbtn{width:44px;height:44px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button,.rail button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:12px;font-weight:500;color:var(--mu);border-radius:var(--r2)}
.tabbar button[aria-current=page],.rail button[aria-current=page]{color:var(--pri)}
.tabbar button[aria-current=page] svg{transform:translateY(-1px)}
@media(min-width:1000px){
  .app{grid-template-columns:96px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:8px;padding:24px 8px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
  .rail .logo{display:grid;place-items:center;height:44px;margin-bottom:12px}
  .rail button{width:100%;font-size:12px}
  .tabbar{display:none}
  .main{padding:0 40px 80px}
}
.ph{padding:14px 0 6px}
.ph h1{font-size:34px;line-height:1.15;margin:4px 0 8px}
.lead{font-size:17px;color:var(--tx2);max-width:56ch}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:16px;transition:transform .12s,filter .12s,background .12s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.quiet{border-color:transparent;background:none;color:var(--tx2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;filter:none}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;min-height:44px;padding:0 16px;font-weight:500}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--pri) 14%,var(--surface));border-color:var(--pri);color:var(--tx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:grid;gap:6px;margin:12px 0}
.fld label,.lbl{font-size:14px;font-weight:500;color:var(--tx2)}
.inp{min-height:48px;border:1px solid var(--border);background:var(--elev);border-radius:var(--r1);padding:0 12px;width:100%}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--border);position:relative;border:0;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--elev);transition:transform .2s;box-shadow:0 1px 2px #0003}
.sw:checked{background:var(--pri)}.sw:checked::after{transform:translateX(20px)}
.sw:disabled{opacity:.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border);min-width:0}
.row:first-child{border-top:0}
.row>div{min-width:0}
.row .sub{font-size:14px;color:var(--mu)}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:56px}

/* статусы */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:99px;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}.pill.ok svg{color:var(--ok)}
.pill.check{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}.pill.check svg{color:var(--warn)}
.pill.help{background:color-mix(in srgb,var(--danger) 14%,var(--surface))}.pill.help svg{color:var(--danger)}
.pill.action{background:var(--pri);color:var(--onpri)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r2);background:color-mix(in srgb,var(--warn) 10%,var(--surface));margin:10px 0 14px;font-size:15px}
.banner svg{flex:none;margin-top:2px;color:var(--warn)}
.banner.err{background:color-mix(in srgb,var(--danger) 9%,var(--surface))}.banner.err svg{color:var(--danger)}

/* растение: арка и горшок */
.arch{position:relative;width:var(--aw,150px);aspect-ratio:3/4.1;border-radius:999px 999px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 55%,var(--surface)),var(--sky));border:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:14px;overflow:hidden;flex:none}
.lv{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.shelf{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;margin:0 -20px;padding-inline:20px;scroll-padding-inline:20px;scrollbar-width:none;cursor:grab}
.shelf::-webkit-scrollbar{display:none}
.shelf.drag{cursor:grabbing;user-select:none;scroll-snap-type:none;scroll-behavior:auto}
@media(hover:hover) and (pointer:fine){.shelf{scroll-snap-type:none}}
.shelf{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.pcard{scroll-snap-align:start;flex:0 0 min(74vw,260px);background:none;border:0;padding:0;text-align:left;display:grid;gap:12px;justify-items:start;--aw:100%}
.pcard .arch{transition:transform .2s}
.pcard:hover .arch{transform:translateY(-3px)}
.pcard h3{font-size:20px;line-height:1.2}
.pcard .meta{font-size:14px;color:var(--mu);display:grid;gap:4px}
.addcard{scroll-snap-align:start;flex:0 0 min(74vw,260px);border:1.5px dashed var(--border);border-radius:999px 999px 14px 14px;aspect-ratio:3/4.1;background:none;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--tx2);font-weight:500;align-self:start}
@media(min-width:760px){.shelf{margin:0 -32px;padding-inline:32px;scroll-padding-inline:32px}.pcard,.addcard{flex:0 0 220px}}
/* характер растения: стадия и самочувствие */
.pl{transform-origin:60px 129px;transform:rotate(var(--rot,0deg)) scale(var(--sc,1),calc(var(--sc,1)*var(--sy,1)));transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .8s}
.st-seed{--sc:.55}.st-grow{--sc:.84}.st-rest{--sc:.94}
.st-seed .fr,.st-grow .fr,.st-seed .fl,.st-grow .fl,.st-rest .fl{display:none}
.mood-action .pl{--rot:4.5deg;--sy:.9;filter:saturate(.62) brightness(.97)}
.mood-check .pl{--rot:-2deg;filter:saturate(.88)}
.mood-help .pl{--sy:.96;filter:grayscale(.75)}
@keyframes sway{0%,100%{rotate:-.9deg}50%{rotate:.9deg}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mood-ok .pl,.mood-check .pl{animation:sway 7s ease-in-out infinite}
.tdrop{animation:bob 2.2s ease-in-out infinite}
[data-motion="off"] .pl,[data-motion="off"] .tdrop{animation:none!important}
/* первый запуск */
[data-screen="onb"] #tabbar,[data-screen="onb"] #rail{display:none!important}
@media(min-width:1000px){[data-screen="onb"] .app{grid-template-columns:minmax(0,1fr)}}
.onb{max-width:520px;margin:0 auto;display:grid;gap:14px;padding-block:8px 24px}
.obl{margin:0;padding-left:22px;display:grid;gap:10px;line-height:1.5}
.obf{margin-top:8px;display:grid}
.radar{position:relative;width:132px;height:132px;margin:10px auto;display:grid;place-items:center;color:var(--pri)}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pri);opacity:0;animation:ping 2s ease-out infinite}.radar i+i{animation-delay:1s}
.radar span{width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--pri) 14%,var(--surface));display:grid;place-items:center}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1);opacity:0}}
.code{font:13.5px/1.6 var(--mono);width:100%;min-height:250px;white-space:pre;overflow:auto;tab-size:2;resize:vertical}
.fct .t2{text-align:right;max-width:46%}
.cols{display:grid;gap:28px;margin-top:20px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr;gap:56px}}
.sec h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.why{border-left:2px solid var(--pri);padding:2px 0 2px 14px;margin:10px 0;color:var(--tx2)}
.why b{color:var(--tx);font-weight:600}

/* страница растения */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--tx2);font-weight:500;min-height:44px;padding:0;margin-top:4px}
.pl{display:grid;gap:24px}
@media(min-width:900px){.pl{grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:start}.pl .hero{position:sticky;top:24px}}
.hero{display:grid;gap:14px;justify-items:start;--aw:min(62vw,230px)}
@media(min-width:900px){.hero{--aw:100%}}
.hero h1{font-size:30px;line-height:1.15}
.state{font:500 24px/1.25 var(--display)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:8px;overflow-x:auto}
.tabs button{border:0;background:none;min-height:48px;padding:0 14px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--pri);font-weight:600}
.grp{padding:16px 0;border-top:1px solid var(--border)}
.grp:first-of-type{border-top:0}
.grp h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.mrow{display:grid;gap:6px;margin-bottom:10px}
.mrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.num{font:300 44px/1 var(--body);letter-spacing:-.02em}
.num.m{font-size:30px}
.num .u{font-size:.42em;font-weight:400;color:var(--tx2);margin-left:3px;letter-spacing:0}
.pair{display:flex;gap:28px;flex-wrap:wrap}
.rb{position:relative;height:8px;border-radius:9px;background:var(--border)}
.rb .tz{position:absolute;top:0;bottom:0;border-radius:9px;background:color-mix(in srgb,var(--pri) 38%,var(--border))}
.rb .mk{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--water);border:3px solid var(--surface);transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.2,.7,.2,1)}
.rb .fill{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--sun);opacity:.85}
.tech{font:12.5px/1.5 var(--mono);color:var(--mu);margin-top:4px;word-break:break-word}
.err{display:grid;gap:8px;padding:14px;border:1px solid var(--border);border-radius:var(--r2);background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.err b{font-weight:600}
.cta{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding:10px 20px;background:linear-gradient(transparent,var(--bg) 40%)}
.cta .in{max-width:520px;margin:0 auto;display:grid;gap:6px;text-align:center}
.cta small{color:var(--mu);font-size:13px}
@media(min-width:1000px){.cta{position:static;padding:0;background:none}.cta .in{max-width:none;text-align:left}}

/* график */
.chartwrap{position:relative;width:100%;margin-top:8px}
.chartwrap svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--elev);border:1px solid var(--border);border-radius:var(--r1);padding:6px 10px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;z-index:3;transform:translate(-50%,-100%)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stats div{display:grid;gap:2px}.stats b{font:400 24px var(--body);letter-spacing:-.01em}.stats span{font-size:13px;color:var(--mu)}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:8px}
.bars div{flex:1;display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:12px;color:var(--mu)}
.bars i{display:block;width:100%;background:color-mix(in srgb,var(--water) 40%,var(--surface));border-top:2px solid var(--water);border-radius:3px 3px 0 0}
.dots{display:flex;gap:10px;margin:10px 0}
.dots div{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--mu);flex:1}
.dots i{width:100%;max-width:44px;height:44px;border-radius:99px 99px 8px 8px;border:1px solid var(--border);display:grid;place-items:center}
.dots i.g{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}.dots i.w{background:color-mix(in srgb,var(--warn) 20%,var(--surface))}

/* события */
.ev{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--border)}
.ev:first-child{border-top:0}
.ev .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sky)}
.ev h3{font:600 16px var(--body)}
.ev time{font-size:13px;color:var(--mu)}
.ev .tr{font:12.5px/1.6 var(--mono);color:var(--tx2);background:var(--sky);padding:8px 10px;border-radius:var(--r1);margin-top:8px;white-space:pre-wrap;word-break:break-word}
.dayh{font-size:13px;font-weight:600;color:var(--mu);margin:20px 0 0;letter-spacing:.04em;text-transform:uppercase}

/* правило */
.sent{font-size:20px;line-height:2.3;margin:6px 0 4px}
.sent select{appearance:none;border:0;border-bottom:2px solid var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface));padding:5px 30px 5px 10px;border-radius:var(--r1) var(--r1) 0 0;font-weight:600;min-height:44px;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.rule{font:14px/1.9 var(--mono);background:var(--sky);padding:12px 14px;border-radius:var(--r2);overflow-x:auto;white-space:pre}
.rule b{color:var(--pri)}
.modes{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{border:1px solid var(--border);background:var(--surface);border-radius:var(--r2);padding:12px;text-align:left;display:grid;gap:2px;min-height:76px;align-content:start}
.mode b{font-weight:600}.mode span{font-size:13px;color:var(--mu)}
.mode[aria-pressed=true]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface));box-shadow:inset 0 0 0 1px var(--pri)}

/* лист */
dialog{border:0;padding:0;background:var(--elev);color:var(--tx);width:min(560px,100%);max-width:100%;max-height:92vh;margin:auto auto 0;border-radius:var(--r4) var(--r4) 0 0;box-shadow:var(--shadow);overflow:auto}
dialog[open]{animation:up .22s ease-out}
dialog::backdrop{background:#0b110e99}
@keyframes up{from{transform:translateY(36px);opacity:0}}
@media(min-width:760px){dialog{margin:auto;border-radius:var(--r4)}}
.sheet{padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.sh-h h2{font-size:22px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--border);margin:6px auto 0}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--border)}.steps i.on{background:var(--pri)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin:8px 0}
.opt{border:1px solid var(--border);background:var(--surface);border-radius:var(--r2);padding:12px;text-align:left;min-height:72px;display:grid;gap:2px;align-content:center}
.opt b{font-weight:600}.opt span{font-size:13px;color:var(--mu)}
