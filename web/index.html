<title>Smart Plant OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..600&family=Onest:wght@300..700&display=swap">
<style>
/* Концепт: подоконник. Растение живёт в арке-окне, горшок показывает влажность. Остальное тихое: воздух, линии, текст. */
:root{
  --bg:#F0F2EC;--surface:#FAFBF8;--elev:#FFFFFF;--border:#D9DED4;
  --tx:#17201B;--tx2:#4F5F56;--mu:#5C6C63;
  --pri:#2C6A4F;--onpri:#FFFFFF;--water:#23788E;--sun:#8F5C08;
  --ok:#2F7D4B;--warn:#8F5C08;--danger:#B3392F;
  --sky:#E3EBE6;--soil:#BBA183;--shadow:0 12px 32px rgba(23,32,27,.14);--shine:rgba(255,255,255,.3);--leaf-hi:#5DAA80;--leaf-lo:#28694D;--fruit:#D4432E;--fruit-hi:#F58C76;--fruit-lo:#962818;--bloom:#DD789E;--bloom-hi:#F9C8DA;--pot:#C48A68;--dirt:#6D5039;
  --display:'Literata',Georgia,serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r1:6px;--r2:10px;--r3:16px;--r4:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613;--surface:#181F1B;--elev:#202A25;--border:#2E3A34;
  --tx:#E9EFEA;--tx2:#B5C2BA;--mu:#8D9D94;
  --pri:#86CFA8;--onpri:#0E2A1C;--water:#74C4DA;--sun:#EDB655;
  --ok:#7ACB92;--warn:#EDB655;--danger:#FF8A80;
  --sky:#1E2A25;--soil:#5B4A3A;--shadow:none;--shine:rgba(255,255,255,.07);--leaf-hi:#6EBB92;--leaf-lo:#357B5A;--fruit:#E5604D;--fruit-hi:#F9A090;--fruit-lo:#A5342A;--bloom:#EE8FB0;--bloom-hi:#FAD2E0;--pot:#B07A5A;--dirt:#4A382A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--surface:#181F1B;--elev:#202A25;--border:#2E3A34;
  --tx:#E9EFEA;--tx2:#B5C2BA;--mu:#8D9D94;
  --pri:#86CFA8;--onpri:#0E2A1C;--water:#74C4DA;--sun:#EDB655;
  --ok:#7ACB92;--warn:#EDB655;--danger:#FF8A80;
  --sky:#1E2A25;--soil:#5B4A3A;--shadow:none;--shine:rgba(255,255,255,.07);--leaf-hi:#6EBB92;--leaf-lo:#357B5A;--fruit:#E5604D;--fruit-hi:#F9A090;--fruit-lo:#A5342A;--bloom:#EE8FB0;--bloom-hi:#FAD2E0;--pot:#B07A5A;--dirt:#4A382A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.mu{color:var(--mu)}.t2{color:var(--tx2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:13px;font-weight:500;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}

/* оболочка */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.main{width:100%;max-width:1120px;margin:0 auto;padding:0 20px calc(170px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:16px 0 10px}
.brand{font:500 17px var(--display);display:flex;align-items:center;gap:10px}
.brand i{width:18px;height:22px;border:2px solid var(--pri);border-radius:99px 99px 3px 3px;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:50%;bottom:3px;width:2px;height:9px;background:var(--pri);transform:translateX(-50%)}
.modebar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--onpri)}
.seg.full{display:flex}.seg.full button{flex:1}
.modebar .seg{flex:1}
.iconbtn{width:44px;height:44px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button,.rail button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:12px;font-weight:500;color:var(--mu);border-radius:var(--r2)}
.tabbar button[aria-current=page],.rail button[aria-current=page]{color:var(--pri)}
.tabbar button[aria-current=page] svg{transform:translateY(-1px)}
@media(min-width:1000px){
  .app{grid-template-columns:96px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:8px;padding:24px 8px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
  .rail .logo{display:grid;place-items:center;height:44px;margin-bottom:12px}
  .rail button{width:100%;font-size:12px}
  .tabbar{display:none}
  .main{padding:0 40px 80px}
}
.ph{padding:14px 0 6px}
.ph h1{font-size:34px;line-height:1.15;margin:4px 0 8px}
.lead{font-size:17px;color:var(--tx2);max-width:56ch}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:16px;transition:transform .12s,filter .12s,background .12s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.quiet{border-color:transparent;background:none;color:var(--tx2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;filter:none}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;min-height:44px;padding:0 16px;font-weight:500}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--pri) 14%,var(--surface));border-color:var(--pri);color:var(--tx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:grid;gap:6px;margin:12px 0}
.fld label,.lbl{font-size:14px;font-weight:500;color:var(--tx2)}
.inp{min-height:48px;border:1px solid var(--border);background:var(--elev);border-radius:var(--r1);padding:0 12px;width:100%}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--border);position:relative;border:0;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--elev);transition:transform .2s;box-shadow:0 1px 2px #0003}
.sw:checked{background:var(--pri)}.sw:checked::after{transform:translateX(20px)}
.sw:disabled{opacity:.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border);min-width:0}
.row:first-child{border-top:0}
.row>div{min-width:0}
.row .sub{font-size:14px;color:var(--mu)}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:56px}

/* статусы */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:99px;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}.pill.ok svg{color:var(--ok)}
.pill.check{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}.pill.check svg{color:var(--warn)}
.pill.help{background:color-mix(in srgb,var(--danger) 14%,var(--surface))}.pill.help svg{color:var(--danger)}
.pill.action{background:var(--pri);color:var(--onpri)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r2);background:color-mix(in srgb,var(--warn) 10%,var(--surface));margin:10px 0 14px;font-size:15px}
.banner svg{flex:none;margin-top:2px;color:var(--warn)}
.banner.err{background:color-mix(in srgb,var(--danger) 9%,var(--surface))}.banner.err svg{color:var(--danger)}

/* растение: арка и горшок */
.arch{position:relative;width:var(--aw,150px);aspect-ratio:3/4.1;border-radius:999px 999px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 55%,var(--surface)),var(--sky));border:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:14px;overflow:hidden;flex:none}
.lv{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;padding:6px 0 16px}
.pcard{background:none;border:0;padding:0;text-align:left;display:grid;gap:10px;justify-items:start;align-content:start;--aw:100%;min-width:0;width:100%}
.pcard .arch{transition:transform .2s}
.pcard:hover .arch{transform:translateY(-3px)}
.pcard h3{font-size:17px;line-height:1.2}
.pcard .meta{font-size:13.5px;color:var(--mu);display:grid;gap:3px}
.addcard{border:1.5px dashed var(--border);border-radius:999px 999px 14px 14px;aspect-ratio:3/4.1;background:none;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--tx2);font-weight:500;align-self:start;width:100%}
@media(min-width:620px){.shelf{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 22px}.pcard h3{font-size:20px}.pcard .meta{font-size:14px}}
.cols{display:grid;gap:28px;margin-top:20px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr;gap:56px}}
.sec h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.why{border-left:2px solid var(--pri);padding:2px 0 2px 14px;margin:10px 0;color:var(--tx2)}
.why b{color:var(--tx);font-weight:600}

/* страница растения */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--tx2);font-weight:500;min-height:44px;padding:0;margin-top:4px}
.pl{display:grid;gap:24px}
@media(min-width:900px){.pl{grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:start}.pl .hero{position:sticky;top:24px}}
.hero{display:grid;gap:14px;justify-items:start;--aw:min(62vw,230px)}
@media(min-width:900px){.hero{--aw:100%}}
.hero h1{font-size:30px;line-height:1.15}
.state{font:500 24px/1.25 var(--display)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:8px;overflow-x:auto}
.tabs button{border:0;background:none;min-height:48px;padding:0 14px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--pri);font-weight:600}
.grp{padding:16px 0;border-top:1px solid var(--border)}
.grp:first-of-type{border-top:0}
.grp h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.mrow{display:grid;gap:6px;margin-bottom:10px}
.mrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.num{font:300 44px/1 var(--body);letter-spacing:-.02em}
.num.m{font-size:30px}
.num .u{font-size:.42em;font-weight:400;color:var(--tx2);margin-left:3px;letter-spacing:0}
.pair{display:flex;gap:28px;flex-wrap:wrap}
.rb{position:relative;height:8px;border-radius:9px;background:var(--border)}
.rb .tz{position:absolute;top:0;bottom:0;border-radius:9px;background:color-mix(in srgb,var(--pri) 38%,var(--border))}
.rb .mk{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--water);border:3px solid var(--surface);transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.2,.7,.2,1)}
.rb .fill{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--sun);opacity:.85}
.tech{font:12.5px/1.5 var(--mono);color:var(--mu);margin-top:4px;word-break:break-word}
.err{display:grid;gap:8px;padding:14px;border:1px solid var(--border);border-radius:var(--r2);background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.err b{font-weight:600}
.cta{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding:10px 20px;background:linear-gradient(transparent,var(--bg) 40%)}
.cta .in{max-width:520px;margin:0 auto;display:grid;gap:6px;text-align:center}
.cta small{color:var(--mu);font-size:13px}
@media(min-width:1000px){.cta{position:static;padding:0;background:none}.cta .in{max-width:none;text-align:left}}

/* график */
.chartwrap{position:relative;width:100%;margin-top:8px}
.chartwrap svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--elev);border:1px solid var(--border);border-radius:var(--r1);padding:6px 10px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;z-index:3;transform:translate(-50%,-100%)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stats div{display:grid;gap:2px}.stats b{font:400 24px var(--body);letter-spacing:-.01em}.stats span{font-size:13px;color:var(--mu)}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:8px}
.bars div{flex:1;display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:12px;color:var(--mu)}
.bars i{display:block;width:100%;background:color-mix(in srgb,var(--water) 40%,var(--surface));border-top:2px solid var(--water);border-radius:3px 3px 0 0}
.dots{display:flex;gap:10px;margin:10px 0}
.dots div{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--mu);flex:1}
.dots i{width:100%;max-width:44px;height:44px;border-radius:99px 99px 8px 8px;border:1px solid var(--border);display:grid;place-items:center}
.dots i.g{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}.dots i.w{background:color-mix(in srgb,var(--warn) 20%,var(--surface))}

/* события */
.ev{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--border)}
.ev:first-child{border-top:0}
.ev .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sky)}
.ev h3{font:600 16px var(--body)}
.ev time{font-size:13px;color:var(--mu)}
.ev .tr{font:12.5px/1.6 var(--mono);color:var(--tx2);background:var(--sky);padding:8px 10px;border-radius:var(--r1);margin-top:8px;white-space:pre-wrap;word-break:break-word}
.dayh{font-size:13px;font-weight:600;color:var(--mu);margin:20px 0 0;letter-spacing:.04em;text-transform:uppercase}

/* правило */
.sent{font-size:20px;line-height:2.3;margin:6px 0 4px}
.sent select{appearance:none;border:0;border-bottom:2px solid var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface));padding:5px 30px 5px 10px;border-radius:var(--r1) var(--r1) 0 0;font-weight:600;min-height:44px;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.rule{font:14px/1.9 var(--mono);background:var(--sky);padding:12px 14px;border-radius:var(--r2);overflow-x:auto;white-space:pre}
.rule b{color:var(--pri)}
.modes{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{border:1px solid var(--border);background:var(--surface);border-radius:var(--r2);padding:12px;text-align:left;display:grid;gap:2px;min-height:76px;align-content:start}
.mode b{font-weight:600}.mode span{font-size:13px;color:var(--mu)}
.mode[aria-pressed=true]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface));box-shadow:inset 0 0 0 1px var(--pri)}

/* лист */
dialog{border:0;padding:0;background:var(--elev);color:var(--tx);width:min(560px,100%);max-width:100%;max-height:92vh;margin:auto auto 0;border-radius:var(--r4) var(--r4) 0 0;box-shadow:var(--shadow);overflow:auto}
dialog[open]{animation:up .22s ease-out}
dialog::backdrop{background:#0b110e99}
@keyframes up{from{transform:translateY(36px);opacity:0}}
@media(min-width:760px){dialog{margin:auto;border-radius:var(--r4)}}
.sheet{padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.sh-h h2{font-size:22px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--border);margin:6px auto 0}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--border)}.steps i.on{background:var(--pri)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin:8px 0}
.opt{border:1px solid var(--border);background:var(--surface);border-radius:var(--r2);padding:12px;text-align:left;min-height:72px;display:grid;gap:2px;align-content:center}
.opt b{font-weight:600}.opt span{font-size:13px;color:var(--mu)}
.opt[aria-pressed=true]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--surface));box-shadow:inset 0 0 0 1px var(--pri)}
.prog{height:10px;border-radius:9px;background:var(--border);overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--water);transition:width .9s linear}
.wsheet{display:grid;gap:8px;justify-items:center;text-align:center}
.wsheet .pot{width:130px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:var(--r2);font-weight:500;z-index:50;max-width:calc(100vw - 32px);text-align:center;animation:up .2s ease-out}
@media(min-width:1000px){.toast{bottom:32px}}
.sk{background:linear-gradient(90deg,var(--border),color-mix(in srgb,var(--border) 40%,var(--surface)),var(--border));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:var(--r1)}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:grid;justify-items:start;gap:10px;padding:20px 0}
.mods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mod{border:1px solid var(--border);border-radius:var(--r2);padding:12px;display:grid;gap:4px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}table.t td,table.t th{text-align:left;padding:8px 10px 8px 0;border-top:1px solid var(--border);font-weight:400;vertical-align:top}
table.t th{font-size:12px;color:var(--mu);font-weight:500;border-top:0}
.scroll{overflow-x:auto}
.note{font-size:14px;color:var(--mu)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
.vin{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
.vin .pcard,.vin .addcard{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--tx2);margin:6px 0 2px}
.lg{display:inline-block;margin-right:6px;vertical-align:middle}
.lg.l{width:16px;height:3px;border-radius:2px;background:var(--water)}.lg.w{width:16px;height:3px;border-radius:2px;background:var(--warn)}

 const rnd=mulberry(p.id.length*997+days*13+shift*7919+p.pot),per=8,n=days*per,pts=[],evs=[];
 let m=p.range[1]-4+rnd()*4,last=-9;const r=p.rate/per;

  if(m<p.range[0]-3+rnd()*5&&i-last>=5){m+=p.lastMl/(p.pot*5);evs.push({i,ml:p.lastMl});last=i}
  pts.push(m+(rnd()-.5)*.8)}
 if(shift===0){const d=p.moisture-pts[n-1];for(let k=0;k<10;k++)pts[n-10+k]+=d*(k+1)/10}
 const out={pts:pts.map(v=>Math.max(4,Math.min(96,v))),evs,n,days,per};SER[key]=out;return out;}

  d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}

 const s=series(p,S.period,0),prev=series(p,S.period,1),cur=avg(s.pts),pv=avg(prev.pts),diff=Math.round(cur-pv);
 const lo=Math.round(s.pts.filter(v=>v<p.range[0]).length/s.n*100),hi=Math.round(s.pts.filter(v=>v>p.range[1]).length/s.n*100),inN=100-lo-hi,tot=s.evs.reduce((a,e)=>a+e.ml,0);

 const w=series(p,7,0),days=[];
 for(let k=6;k>=0;k--){const d=new Date(NOW.getTime()-k*864e5),sl=w.pts.slice(Math.max(0,w.n-(k+1)*8),w.n-k*8),a=sl.length?avg(sl):p.moisture;days.push({d,a,good:a>=p.range[0]-2,k})}

  <div class="tile" style="--c:var(--sun)"><span class="tic">${ic('tank',16)}</span><b>${tot} мл</b><span>воды за период</span></div></div>

  <div class="legend"><span><i class="lg l"></i>Влажность</span><span><i class="lg w"></i>Ниже нормы</span><span><i class="lg b"></i>Ваша норма</span><span><i class="lg d"></i>Полив</span></div></div>
 <div class="card"><h2 class="cap2">Сколько времени земля была в норме</h2>
  <div class="tir" role="img" aria-label="Ниже нормы ${lo}%, в норме ${inN}%, выше нормы ${hi}%"><i style="width:${lo}%;background:var(--warn)"></i><i style="width:${inN}%;background:var(--ok)"></i><i style="width:${hi}%;background:var(--water)"></i></div>
  <div class="legend2"><span><i style="background:var(--warn)"></i>Ниже нормы ${lo}%</span><span><i style="background:var(--ok)"></i>В норме ${inN}%</span><span><i style="background:var(--water)"></i>Выше нормы ${hi}%</span></div>
  <div class="why" style="margin-bottom:0">${diff<=-4?`Земля суше, чем в прошлом периоде (на ${Math.abs(diff)} п.п.): быстрее высыхает при ${p.air>24?'более тёплом':'обычном'} воздухе.`:diff>=4?`Земля влажнее, чем в прошлом периоде (на ${diff} п.п.).`:'Динамика близка к прошлому периоду.'} Линия это измерения датчика, выводы это расчёт, а не диагноз.</div></div>

 let day='',h='',n=0;

 return `<header class="ph"><h1 class="disp">Настройки</h1></header>${seg}<div style="max-width:680px">${t==='main'?main:adv}</div>

 <div class="fld kbsearch"><label class="sr" for="kbq">Поиск</label><input class="inp" id="kbq" type="search" placeholder="Найти растение" value="${esc(S.kbq)}" data-act="kbq" autocomplete="off"></div>
 <div class="chips" role="group" aria-label="Тип" style="margin-bottom:8px">${[['all','Все'],...Object.entries(TYPES).map(([k,T])=>[k,T.label])].map(([k,l])=>`<button class="chip" data-act="kbt" data-v="${k}" aria-pressed="${S.kbt===k}">${l}</button>`).join('')}</div>

function kbSheet(id){const k=kbOf(id),T=TYPES[k.type],tmp=`${tc(k.t[0])}–${tc(k.t[1])} °${S.units}`;
 openSheet(shHead(esc(k.name))+`<p class="note"><i>${esc(k.latin)}</i> · ${T.label}</p><div class="needs"><div class="need" style="grid-column:1/-1"><span class="nl">${ic('drop',16)}Вода</span><b>${k.min}–${k.max}%</b><small>влажность земли для взрослого растения</small><div class="rb"><div class="tz" style="left:${k.min}%;width:${k.max-k.min}%"></div></div></div><div class="need"><span class="nl">${ic('sun',16)}Свет</span><b>от ${k.need} ч</b><small>в день</small></div><div class="need"><span class="nl">${ic('thermo',16)}Температура</span><b>${tmp}</b><small>комфортно</small></div><div class="need" style="grid-column:1/-1"><span class="nl">${ic('window',16)}Воздух</span><b>${k.hum}%</b><small>влажность воздуха</small></div></div><div class="why">${esc(k.tip)}</div><p class="note">Для росткa, цветения или покоя система скорректирует норму. Это ориентир, а не диагноз.</p><button class="btn pri big" style="margin-top:14px" data-act="kbadd" data-id="${k.id}">${ic('plus',20)}Добавить такое растение</button>`);}
function vDiag(){return `<button class="back" data-act="more">${ic('back',20)}Настройки</button><header class="ph"><p class="eyebrow">Для разработчиков</p><h1 class="disp">Диагностика</h1><p class="lead">Значения демонстрационные.</p></header>
 <section class="sec" style="margin-top:14px"><h2>Модули</h2><div class="mods">${[['S1','Датчик почвы','ёмкостный · GPIO 34 · ok'],['S2','Датчик почвы','ёмкостный · GPIO 35 · ok'],['S3','Датчик почвы','ёмкостный · GPIO 36 · ok'],['C1','Воздух','SHT41 · I2C 0x44 · ok'],['L1','Свет','BH1750 · I2C 0x23 · ok'],['P1','Насос','реле · GPIO 5 · ok'],['W1','Уровень воды','поплавок · GPIO 6 · ok']].map(([i,n,d])=>`<div class="mod"><b>${i} · ${n}</b><span class="tech">${d}</span></div>`).join('')}</div></section>
 <div class="cols"><section class="sec"><h2>Система</h2><div class="scroll"><table class="t"><tr><td>Плата</td><td>ESP32-C3, 160 МГц</td></tr><tr><td>Прошивка</td><td>0.1.0 · сборка 2026-10-12</td></tr><tr><td>Свободная память</td><td>142 КБ</td></tr><tr><td>Wi-Fi</td><td>−58 дБм · 192.168.1.42</td></tr><tr><td>Работает</td><td>6 д 4 ч · сброс: питание</td></tr></table></div></section>
 <section class="sec"><h2>Интерфейсы</h2><div class="scroll"><table class="t"><tr><td>REST</td><td class="tech">/api/v1/plants</td></tr><tr><td>События</td><td class="tech">/api/v1/ws</td></tr><tr><td>MQTT</td><td>выключен</td></tr><tr><td>Home Assistant</td><td>не подключён</td></tr></table></div></section></div>
 <section class="sec" style="margin-top:22px"><h2>Трасса событий</h2><div class="rule">12:00:04 sensor.moisture.changed  S1=58.0\n12:00:04 rule.evaluated  rule-1 SKIP\n11:59:04 sensor.moisture.changed  S2=33.0\n11:59:04 plant.threshold.reached  pepper &lt; 40\n11:58:02 module.heartbeat  P1 ok</div></section>`;}

/* сборка экрана */
function nav(){const items=[['home','leaf','Растения'],['care','care','Уход'],['log','list','События'],['more','gear','Настройки']];
 const cur=S.screen==='plant'?'home':(S.screen==='diag'||S.screen==='kb')?'more':S.screen==='algo'?'care':S.screen;
 const html=items.map(([k,i,l])=>`<button data-act="nav" data-v="${k}" ${cur===k?'aria-current="page"':''}>${ic(i,24)}<span>${l}</span></button>`).join('');
 $('#tabbar').innerHTML=html;$('#rail').innerHTML=`<div class="logo brand"><i></i></div>`+html;}
function render(keepScroll){
 const v=$('#view'),y=scrollY;
 const map={home:vHome,plant:vPlant,care:vCare,algo:vAlgo,log:vLog,more:vMore,diag:vDiag,kb:vKb};
 v.innerHTML=map[S.screen]();
 nav();
 // липкая кнопка полива на мобильном
 const host=$('#ctaHost');host.innerHTML='';
 if(S.screen==='plant'&&matchMedia('(max-width:999px)').matches){const p=P(S.pid),c=ctaState(p);host.innerHTML=`<div class="cta"><div class="in"><button class="btn pri big" data-act="water" ${c.dis?'disabled':''}>${ic('drop',22)}${c.label}</button>${c.hint?`<small>${c.hint}</small>`:''}</div></div>`;const d=v.querySelector('.hero .cta');if(d)d.remove();}
 animatePots(v);if(S.screen==='plant'&&S.tab==='hist')drawChart();if(S.screen==='kb')kbFilter();
 if(keepScroll)scrollTo(0,y);}
function countUp(root){root.querySelectorAll('[data-to]').forEach(el=>{const to=+el.dataset.to,n=el.firstChild;if(!n||n.nodeType!==3||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);n.nodeValue=Math.round(to*e);if(k<1)requestAnimationFrame(f)})(t0)})}
function enter(){const v=$('#view');v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin');countUp(v)}
function go(screen,extra={}){Object.assign(S,extra,{screen});S.why=false;S._ck='';render();enter();scrollTo(0,0);$('#view').focus({preventScroll:true})}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;e.setAttribute('role','status');$('#toastHost').append(e);setTimeout(()=>e.remove(),2600)}
function say(m){$('#live').textContent=m}

/* лист */
const sheet=$('#sheet');
function openSheet(html){sheet.innerHTML=`<div class="grab"></div><div class="sheet">${html}</div>`;if(!sheet.open)sheet.showModal()}
function closeSheet(){if(sheet.open)sheet.close()}
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

const shHead=t=>`<div class="sh-h"><h2 class="disp" id="shT">${t}</h2><button class="iconbtn" data-act="closesheet" aria-label="Закрыть">${ic('close')}</button></div>`;

/* полив */
const W={state:'idle',ml:150,custom:false,done:0,total:0,timer:null};
function openWater(){const p=P(S.pid);W.state='choose';W.ml=p.nextMl>=250?250:p.nextMl>=150?150:120;W.custom=false;renderWater()}
function renderWater(){const p=P(S.pid);let h='';
 if(W.state==='choose'){const wet=p.moisture>=p.range[1]-5&&!S.flags.sensor,opts=[[80,'Немного'],[150,'Средне'],[250,'Много']];
  h=shHead('Полить: '+esc(p.name))+`<p class="t2">Сколько воды?</p><div class="opts">${opts.map(([v,l])=>`<button class="opt" data-act="wml" data-v="${v}" aria-pressed="${!W.custom&&W.ml===v}"><b>${l}</b><span>${v} мл</span></button>`).join('')}<button class="opt" data-act="wcustom" aria-pressed="${W.custom}"><b>Своё</b><span>${W.custom?W.ml+' мл':'ввести мл'}</span></button></div>
  ${W.custom?`<div class="fld"><label for="cm">Объём, мл</label><input class="inp" id="cm" type="number" min="20" max="500" step="10" value="${W.ml}" data-act="cm"></div>`:''}
  ${wet?`<div class="banner">${ic('alert')}<div>Земля уже влажная (${p.moisture}%). Полить всё равно?</div></div>`:''}
  <button class="btn pri big" data-act="wstart">${ic('drop',22)}Запустить</button>`;}
 else if(W.state==='starting'){h=shHead('Полить: '+esc(p.name))+`<div class="wsheet">${pot(p.moisture,p.range,true)}<p class="t2"><span class="spin" style="display:inline-block;width:14px;height:14px;border:2px solid var(--water);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px"></span>Запускаю насос…</p></div>`;}
 else if(W.state==='run'){h=shHead('Поливаю…')+`<div class="wsheet"><div class="drops" aria-hidden="true"><i></i><i></i><i></i></div>${pot(p.moisture,p.range,true)}<div class="num" id="wml">${W.done}<span class="u"> / ${W.total} мл</span></div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${W.total}" aria-valuenow="${W.done}" id="wpb"><i id="wbar" style="width:0"></i></div><p class="t2" id="wt"></p></div><button class="btn danger big" data-act="wstop">Остановить</button>`;}
 else{const m=p.moisture,d=daysLeft(p);h=shHead(W.state==='stopped'?'Полив остановлен':'Полито')+`<div class="wsheet">${pot(m,p.range,true)}<div class="num">${W.done}<span class="u"> мл</span></div><p class="t2">Влажность земли сейчас ${m}%. ${d<0.5?'Следующий полив скоро.':'Следующий полив '+dstr(d)+'.'} Это оценка.</p></div><button class="btn pri big" data-act="closesheet" style="margin-top:14px">Готово</button>`;}
 sheet.innerHTML=`<div class="grab"></div><div class="sheet">${h}</div>`;if(!sheet.open)sheet.showModal();animatePots(sheet);}
function startWater(){const p=P(S.pid);W.state='starting';renderWater();
 setTimeout(()=>{if(W.state!=='starting')return;W.state='run';W.done=0;W.total=W.ml;W.start=p.moisture;renderWater();say('Полив начался');
  const rate=10,gainPer=1/(p.pot*5);let last=Date.now();
  W.timer=setInterval(()=>{W.done=Math.min(W.total,W.done+rate);const m=Math.min(100,Math.round(W.start+W.done*gainPer));
   const bar=$('#wbar');if(bar)bar.style.width=(W.done/W.total*100)+'%';const wm=$('#wml');if(wm)wm.innerHTML=`${W.done}<span class="u"> / ${W.total} мл</span>`;const wt=$('#wt');if(wt)wt.textContent=`Осталось ${Math.max(0,Math.ceil((W.total-W.done)/rate))} с`;
   const lv=sheet.querySelector('.lv');if(lv)lv.style.transform=`scaleY(${m/100})`;p.moisture=m;
   if(W.done>=W.total){clearInterval(W.timer);p.last='только что, '+W.total+' мл';p.lastMl=W.total;W.state='done';say(`Полито ${W.total} миллилитров`);renderWater();render(true)}},1000);},1200);}
function stopWater(){clearInterval(W.timer);W.state='stopped';say('Полив остановлен');renderWater();render(true)}

 if(st===2)h+=`<p class="t2">Нажмите, чтобы найти датчик.</p>${WZ.found?`<div class="mod" style="margin:10px 0"><b>Нашли датчик влажности земли</b><span class="t2">сейчас показывает 61%</span>${S.mode!=='simple'?`<span class="tech">GPIO 4 · ADC1_CH4 · сырое 2012</span>`:''}${S.mode==='developer'?`<span class="tech">driver=capacitive_soil v1.2 · cap: soil.moisture</span>`:''}</div>`:''}<button class="btn ${WZ.found?'':'pri'} big" data-act="sfind" ${WZ.finding?'disabled':''}>${WZ.finding?'<span class="spin"></span>Ищу датчик…':WZ.found?'Найти заново':'Найти датчик'}</button>${WZ.found?`<button class="btn pri big" style="margin-top:10px" data-act="snext">Дальше</button>`:''}`;

/* события */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type!=='checkbox'))return;const a=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
 switch(a){
 case 'nav':go(v);break;
 case 'open':go('plant',{pid:id,tab:'now'});break;
 case 'home':go('home');break;
 case 'more':go('more',{setTab:'adv'});break;
 case 'algo':go('algo',{algoTab:'main'});break;
 case 'backcare':go('care');break;
 case 'algotab':S.algoTab=v;render(true);break;
 case 'settab':S.setTab=v;render(true);break;
 case 'tab':S.tab=v;S.why=false;render(true);break;
 case 'period':S.period=+v;render(true);break;
 case 'why':S.why=!S.why;render(true);break;
 case 'water':openWater();break;
 case 'wml':W.ml=+v;W.custom=false;renderWater();break;
 case 'wcustom':W.custom=true;renderWater();setTimeout(()=>$('#cm')&&$('#cm').focus(),30);break;
 case 'wstart':startWater();break;
 case 'wstop':stopWater();break;
 case 'closesheet':closeSheet();break;
 case 'fixsensor':toast('Проверяю датчик…');setTimeout(()=>{S.flags.sensor=false;render(true);toast('Датчик отвечает. Автополив снова включён')},1400);break;
 case 'care':go('care');break;
 case 'careplant':S.pid=id;render(true);break;
 case 'cmode':S.care.mode=v;render(true);break;
 case 'day':S.care.days[+v]=S.care.days[+v]?0:1;render(true);break;
 case 'night':S.care.night=t.checked;render(true);break;
 case 'evf':S.evf=v;render(true);break;
 case 'evp':S.evp=v;render(true);break;
 case 'evwater':S.pid=id;openWater();break;
 case 'kb':go('kb');break;
 case 'backset':go('more',{setTab:'main'});break;
 case 'kbt':S.kbt=v;render(true);break;
 case 'kbopen':kbSheet(id);break;
 case 'kbadd':{const k=kbOf(id);Object.assign(AP,{step:0,name:k.name,type:k.type,kb:k.id,st:defStage(k.type),room:S.rooms[0]||null,adding:false,newRoom:'',kq:''});renderAddPlant();break}
 case 'stage':{const p=P(S.pid);p.st=v;applyStage(p);render(true);toast('Стадия: '+stageLabel(p)+'. Норма обновлена');break}
 case 'applyml':S.care.amount=+v;render(true);toast('Порция '+v+' мл применена');break;
 case 'resetrange':{const p=P(S.pid);applyStage(p);render(true);toast('Рекомендации восстановлены');break}
 case 'motion':S.motion=v;document.documentElement.dataset.motion=v==='off'?'off':'';panel('appear');render(true);break;
 case 'doreset':Object.assign(S.cfg,{quiet:true,qFrom:'22:00',qTo:'07:00',tankL:2,maxWater:250,ha:false,haHost:'',haDisc:true,autoBackup:true,bkFreq:'daily',autoUpd:true,localApi:true});Object.assign(S.care,{amount:150,night:true,limit:600,vac:14});S.notif={needs:true,skipped:true,tank:true,low:false,sensor:true,offline:true};closeSheet();render(true);toast('Настройки сброшены');break;
 case 'calib':case 'calibp':if(id)S.pid=id;openSensor(3);break;
 case 'addsensor':openSensor(0);break;
 case 'stype':WZ.type=v;renderSensor();break;
 case 'snext':WZ.step++;renderSensor();break;
 case 'sfind':WZ.finding=true;renderSensor();setTimeout(()=>{WZ.finding=false;WZ.found=true;renderSensor()},1300);break;
 case 'scal':WZ.cal.busy=v;renderSensor();setTimeout(()=>{WZ.cal[v]=true;WZ.cal.busy=null;renderSensor()},1400);break;
 case 'splant':WZ.plant=id;renderSensor();break;
 case 'addplant':Object.assign(AP,{step:0,name:'',type:null,kb:null,st:'grow',room:S.rooms[0]||null,adding:false,newRoom:'',kq:''});renderAddPlant();break;
 case 'atype':AP.type=v;AP.kb=null;if(!(STAGES[v]||[]).some(x=>x[0]===AP.st))AP.st=defStage(v);renderAddPlant();break;
 case 'akb':{const k=kbOf(id);AP.kb=k.id;AP.type=k.type;if(!(STAGES[k.type]||[]).some(x=>x[0]===AP.st))AP.st=defStage(k.type);renderAddPlant();break}
 case 'astage':AP.st=v;renderAddPlant();break;
 case 'aroom':AP.room=v;renderAddPlant();break;
 case 'aaddroom':AP.adding=true;renderAddPlant();setTimeout(()=>$('#nr')&&$('#nr').focus(),30);break;
 case 'aroomadd':{const n=AP.newRoom.trim();if(n){if(!S.rooms.includes(n))S.rooms.push(n);AP.room=n;AP.adding=false;AP.newRoom='';renderAddPlant()}break}
 case 'anext':AP.step++;renderAddPlant();break;
 case 'afinish':{const T=TYPES[AP.type],k=AP.kb&&kbOf(AP.kb),base=k?{min:k.min,max:k.max,rate:k.rate}:{min:T.prof[0],max:T.prof[1],rate:T.prof[2]};
   const np={id:'p'+Date.now(),kind:k?k.sil:T.sil,type:AP.type,kb:k?k.id:null,st:AP.st,base,ml0:T.ml,name:AP.name.trim(),species:k?k.latin:T.label,place:AP.room,day:1,pot:2,moisture:50,range:[0,0],rate:base.rate,air:23.0,hum:57,lightH:k?k.need:T.need,lightNeed:k?k.need:T.need,last:'ещё не поливали',lastMl:100,next:'нужен датчик',nextMl:100,adc:2000,gpio:0,mod:'—',nextWhy:'Добавьте датчик влажности, и система начнёт подсказывать время полива.',note:''};
   applyStage(np);PLANTS.push(np);closeSheet();go('home');toast('Растение добавлено');break}
 case 'addroom':{const n=($('#rn').value||'').trim();if(!n){toast('Введите название комнаты');break}if(!S.rooms.includes(n))S.rooms.push(n);panel('rooms');render(true);setTimeout(()=>$('#rn')&&$('#rn').focus(),30);break}
 case 'delroom':S.rooms.splice(+v,1);panel('rooms');render(true);break;
 case 'rooms':case 'notif':case 'appear':case 'sensors':case 'ha':case 'backup':case 'sim':case 'defaults':case 'device':case 'tankpump':case 'reset':panel(a);break;
 case 'diag':go('diag');break;
 case 'thsel':{S.theme=v;const r=document.documentElement;if(v==='system')delete r.dataset.theme;else r.dataset.theme=v;panel('appear');render(true);break}
 case 'units':S.units=v;panel('appear');render(true);break;

 }});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.act;if(!a)return;
 if(a==='cm'){W.ml=Math.max(20,Math.min(500,+t.value||20))}
 if(a==='aname'){AP.name=t.value;const b=sheet.querySelector('[data-act=anext]');if(b)b.disabled=!AP.name.trim()}
 if(a==='kbq'){S.kbq=t.value;kbFilter()}
 if(a==='kq'){AP.kq=t.value;kqFilter()}
 if(a==='nroom'){AP.newRoom=t.value;const b=sheet.querySelector('[data-act=aroomadd]');if(b)b.disabled=!t.value.trim()}
 if(a==='sname')WZ.name=t.value;
 if(a==='r0'||a==='r1'){const p=P(S.pid);p.range[a==='r0'?0:1]=+t.value;$('#'+a+'v').textContent=t.value+'%'}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;if(!a)return;
 if(a==='care'){const k=t.dataset.k;S.care[k]=['amount','gap','limit','vac'].includes(k)?+t.value:t.value;render(true)}
 if(a==='aplace')AP.place=t.value;
 if(a==='nt')S.notif[t.dataset.k]=t.checked;
 if(a==='cfg'){S.cfg[t.dataset.k]=t.checked;if(t.dataset.k==='ha')panel('ha');render(true)}
 if(a==='cfgv'){const k=t.dataset.k;S.cfg[k]=['tankL','maxWater'].includes(k)?+t.value:t.value;render(true)}
 if(a==='flag'){S.flags[t.dataset.k]=t.checked;render(true)}
 if(a==='r0'||a==='r1'){render(true)}});
function setThemeIcon(){}
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.k==='adv')S.advOpen=e.target.open},true);
PLANTS.forEach(applyStage);setThemeIcon();render();
setTimeout(()=>{S.booting=false;render(true);enter()},700);
</script>
